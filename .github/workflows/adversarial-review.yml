# Managed by: factory review-lane. Remove with: ./factory review-lane disable
name: Adversarial review

# Model findings are advisory. The separate optional completion check records
# exact coverage; a posted skip or failure never counts as a completed review.
# Trusted base code handles PR content only as data. Never execute PR-head code
# with this workflow's write token or provider key.
# Contract: docs/adr/0100-batched-review.md:103.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Manual dispatch must also execute the trusted default branch. The Go
    # adapter independently validates repository, target branch and exact refs.
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      REPO: ${{ github.repository }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out the base commit (trusted — never the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Set up the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false

      - name: Build the trusted review client before exposing its API key
        run: go build -o "$RUNNER_TEMP/factory-review-client" ./cmd/factory

      # Official https://github.com/actions/cache/releases/tag/v6.1.0
      - name: Restore authenticated completed batches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-review-cache
          key: factory-review-v1-${{ runner.os }}-${{ github.sha }}-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            factory-review-v1-${{ runner.os }}-${{ github.sha }}-${{ github.event.pull_request.number || inputs.pr }}-

      - name: Review
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEW_GO_CLIENT: ${{ runner.temp }}/factory-review-client
          REVIEW_HTTP_RETRIES: ${{ vars.REVIEW_HTTP_RETRIES != '' && vars.REVIEW_HTTP_RETRIES || '1' }}
          REVIEW_TIMEOUT_SECONDS: ${{ vars.REVIEW_TIMEOUT_SECONDS != '' && vars.REVIEW_TIMEOUT_SECONDS || '1200' }}
          REVIEW_BATCH_BYTES: ${{ vars.REVIEW_BATCH_BYTES != '' && vars.REVIEW_BATCH_BYTES || '60000' }}
          REVIEW_MAX_BATCHES: ${{ vars.REVIEW_MAX_BATCHES != '' && vars.REVIEW_MAX_BATCHES || '16' }}
          REVIEW_MAX_REQUESTS: ${{ vars.REVIEW_MAX_REQUESTS != '' && vars.REVIEW_MAX_REQUESTS || '16' }}
          REVIEW_TOTAL_MAX_TOKENS: ${{ vars.REVIEW_TOTAL_MAX_TOKENS != '' && vars.REVIEW_TOTAL_MAX_TOKENS || '524288' }}
          REVIEW_TOTAL_INPUT_BYTES: ${{ vars.REVIEW_TOTAL_INPUT_BYTES != '' && vars.REVIEW_TOTAL_INPUT_BYTES || '2097152' }}
          REVIEW_FALLBACK_PROVIDERS: ${{ vars.REVIEW_FALLBACK_PROVIDERS }}
          REVIEW_MAX_PROMPT_PRICE: ${{ vars.REVIEW_MAX_PROMPT_PRICE }}
          REVIEW_MAX_COMPLETION_PRICE: ${{ vars.REVIEW_MAX_COMPLETION_PRICE }}
        run: |
          args=(review-batch github --pr "$PR" --repository "$REPO"
            --expected-base "$EXPECTED_BASE" --output "$RUNNER_TEMP/factory-review-output"
            --cache "$RUNNER_TEMP/factory-review-cache")
          if [ -n "$EXPECTED_HEAD" ]; then args+=(--expected-head "$EXPECTED_HEAD"); fi
          FACTORY_BRIDGE_PROTOCOL='' "$REVIEW_GO_CLIENT" "${args[@]}"

      - name: Save authenticated completed batches
        if: always() && steps.review.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-review-cache
          key: factory-review-v1-${{ runner.os }}-${{ github.sha }}-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Official https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      - name: Retain exact-commit coverage and findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adversarial-review-${{ github.event.pull_request.number || inputs.pr }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/factory-review-output/report.json
            ${{ runner.temp }}/factory-review-output/review.md
          if-no-files-found: warn
          retention-days: 7
