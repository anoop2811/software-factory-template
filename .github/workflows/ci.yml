name: Template CI

# The template's own factory: every gate it ships is proven here by
# break/fix self-tests (scripts/selftest/run.sh) — a check that has only
# ever been seen passing is unverified.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go (source runtime and pinned actionlint)
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'

      - name: Provision locked source runtime modules
        # The source copy gate compiles offline; setup owns acquisition.
        # docs/adr/0126-go-source-launcher-and-direct-init-upgrade.md:227.
        run: |
          if [ -f cmd/factory/main.go ] && [ -f internal/sourcebootstrap/publish.go ] &&
             [ -f go.mod ] && grep -Fxq 'module github.com/anoop2811/software-factory-template' go.mod &&
             [ -f scripts/factory-init.sh ] &&
             [ "$(sed -n '2p' scripts/factory-init.sh)" = '# Factory native initializer adapter: source-v1' ]; then
            go mod download
            git diff --exit-code -- go.mod go.sum
          fi

      - name: Break/fix self-tests (every gate proven)
        run: ./scripts/selftest/run.sh

      - name: Adversarial review request fixtures (no API calls)
        run: ./scripts/selftest/adversarial-review.sh

      - name: Selftest with optional pack sources absent
        run: ./scripts/selftest/optional-packs.sh

      - name: Java build-tool installer fixtures
        run: ./scripts/selftest/java-build-tool.sh

      - name: Structural harness eval (adapter wiring proven)
        run: make eval

      - name: Shell syntax
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n factory
          sh -n runtime/shell/readers.sh
          bash -n runtime/shell/config.sh
          sh -n runtime/shell/helpers.sh

      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck -S warning -x
          shellcheck -S warning -x factory
          shellcheck -s sh -S warning runtime/shell/readers.sh
          shellcheck -s bash -S warning runtime/shell/config.sh
          shellcheck -s bash -S warning runtime/shell/helpers.sh

      - name: actionlint
        # GitHub's new job cache-mode is not yet in the latest tagged parser.
        # Independent workflow criteria validate its scope and value.
        # docs/adr/0112-bounded-parallel-review.md:86.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color -ignore 'unexpected key "cache-mode" for "job" section'

      - name: hook-existence-check
        run: ./scripts/hooks/hook-existence-check.sh

      - name: copy-manifest-check
        run: ./scripts/hooks/copy-manifest-check.sh

      - name: gate-instrumentation-check
        run: ./scripts/hooks/gate-instrumentation-check.sh

      - name: wiki-lint
        run: ./scripts/hooks/wiki-lint.sh

      - name: commit-message-lint (PR range)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA" 2>/dev/null || true
          for sha in $(git rev-list "$BASE_SHA..HEAD"); do
            ./scripts/hooks/commit-message-lint.sh "$sha"
          done

      - name: decision-log-gate (PR range)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: ./scripts/hooks/decision-log-gate.sh "$BASE_SHA" HEAD

  maven-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned Maven
        run: |
          curl -fsSL https://dlcdn.apache.org/maven/maven-3/3.9.16/binaries/apache-maven-3.9.16-bin.tar.gz -o "$RUNNER_TEMP/maven.tar.gz"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          echo "MAVEN_BINARY=$RUNNER_TEMP/apache-maven-3.9.16/bin/mvn" >> "$GITHUB_ENV"
      - name: Maven quality break/fix acceptance
        run: ./scripts/selftest/maven-quality.sh
