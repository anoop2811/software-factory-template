name: Go runtime candidate

# Template-only: factory-init does not copy this workflow or the factory module.
# No runtime routing, adopter Go pack selection, release artifacts or paid calls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# docs/adr/0101-go-release-handoff.md:608 — supersede PR runs only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # docs/adr/0097-installation-source-image-bundles.md:231 — suite allowance only.
    timeout-minutes: 30
    # docs/adr/0104-adaptive-qualification-workers.md:53 — bounded auto selection.
    env:
      GO_RUNTIME_TEST_MAX_PROCS: ${{ vars.GO_RUNTIME_TEST_MAX_PROCS || '4' }}
      GO_RUNTIME_REVISION: ${{ github.sha }}
      GO_RUNTIME_RUN_ID: ${{ github.run_id }}
      GO_RUNTIME_PRODUCER_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Differential acceptance executes the identified historical baseline.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum
      # per docs/adr/0072-go-budget-argument-compatibility.md:137
      - name: Install qualified Python interpreter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          activate-environment: true
          venv-path: ${{ runner.temp }}/factory-python
          no-project: true
          enable-cache: false
      - name: Confirm qualified Python interpreter
        run: |
          python3 -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 14)"
      # docs/adr/0101-go-release-handoff.md:595 — setup only; checks always run.
      - name: Restore pinned quality tools
        id: quality-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-quality-tools
          key: factory-quality-v2-${{ runner.os }}-${{ runner.arch }}-go1.27.4-golangci-v2.14.0-govuln-v1.7.0-${{ hashFiles('tools/security/go.mod', 'tools/security/go.sum') }}
      - name: Add pinned quality tools to PATH
        run: echo "$RUNNER_TEMP/factory-quality-tools" >> "$GITHUB_PATH"
      - name: Install pinned quality tools
        if: steps.quality-tools.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/factory-quality-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go -C tools/security install -mod=readonly github.com/securego/gosec/v2/cmd/gosec
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # docs/adr/0151-reliable-ci-qualification.md:35 -- global checks always run once per platform.
      - name: Qualify packages and prepare race acceptance
        run: make go-runtime-ci-prepare GO_RUNTIME_TEST_TIMEOUT=25m GO_RUNTIME_TEST_PROCS=auto
      # docs/adr/0151-reliable-ci-qualification.md:79 -- exact same-run executable transport.
      - name: Save qualified acceptance inputs
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            acceptance/qualification.test
            .factory/qualification/prepared-v1/ginkgo
            .factory/qualification/prepared-v1/receipt.json
          key: factory-prepared-v1-${{ github.run_id }}-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-go1.27.4-race-${{ hashFiles('go.mod', 'go.sum') }}
      - name: Retain preparation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-runtime-preparation-${{ runner.os }}-${{ runner.arch }}
          path: |
            .factory/qualification/prepared-v1/prepare.log
            .factory/qualification/prepared-v1/receipt.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  go-runtime-installation:
    name: go-runtime-${{ matrix.group }} (${{ matrix.os }})
    needs: go-runtime
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # docs/adr/0116-explicit-go-local-initialization.md:99.
        # docs/adr/0117-explicit-go-local-upgrade.md:94.
        # docs/adr/0118-default-packaged-go-initialization.md:76.
        # docs/adr/0121-local-upgrade-readiness-boundary.md:117.
        # docs/adr/0122-default-packaged-go-upgrade.md:172.
        # docs/adr/0126-go-source-launcher-and-direct-init-upgrade.md:343.
        # docs/adr/0146-initialized-installed-ci.md:293.
        # docs/adr/0148-transactional-installed-ci-migration.md:256.
        # docs/adr/0148-transactional-installed-ci-migration.md:488.
        # docs/adr/0148-transactional-installed-ci-migration.md:515.
        # docs/adr/0148-transactional-installed-ci-migration.md:656.
        # docs/adr/0151-reliable-ci-qualification.md:40 -- execute every disjoint acceptance family.
        # docs/adr/0151-reliable-ci-qualification.md:219 -- separate serial local-upgrade fixture owners.
        group: [base-acceptance, installation, release-handoff, release-retention, release-ci, initialized-ci, ci-migration, historical-recipe, local-init, local-upgrade, local-upgrade-predecessor, local-upgrade-go, local-recovery, default-init, default-upgrade, source-entrypoints]
    runs-on: ${{ matrix.os }}
    # docs/adr/0101-go-release-handoff.md:559 — disjoint qualification with headroom.
    timeout-minutes: 30
    # docs/adr/0104-adaptive-qualification-workers.md:53 — bounded auto selection.
    env:
      GO_RUNTIME_TEST_MAX_PROCS: ${{ vars.GO_RUNTIME_TEST_MAX_PROCS || '4' }}
      GO_RUNTIME_REVISION: ${{ github.sha }}
      GO_RUNTIME_RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Differential acceptance executes the identified historical baseline.
          fetch-depth: 0
      # docs/adr/0149-compiler-provenance-and-security-patches.md:63.
      # docs/adr/0148-transactional-installed-ci-migration.md:319.
      - name: Set up the historical fixture compiler
        if: matrix.group == 'historical-recipe' || matrix.group == 'ci-migration'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        env:
          GOTOOLCHAIN: local
          GOENV: 'off'
        with:
          go-version: '1.27.3'
          cache: false
      - name: Retain the historical fixture compiler path
        if: matrix.group == 'historical-recipe' || matrix.group == 'ci-migration'
        shell: bash
        run: |
          historical_go="$(command -v go)"
          case "$historical_go" in
            /*) ;;
            *) echo "Historical Go compiler must have an absolute path" >&2; exit 1 ;;
          esac
          printf 'FACTORY_HISTORICAL_GO=%s\n' "$historical_go" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum
      # per docs/adr/0072-go-budget-argument-compatibility.md:137
      - name: Install qualified Python interpreter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          activate-environment: true
          venv-path: ${{ runner.temp }}/factory-python
          no-project: true
          enable-cache: false
      - name: Confirm qualified Python interpreter
        run: |
          python3 -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 14)"
      # docs/adr/0151-reliable-ci-qualification.md:79 -- misses and partial matches cannot become success.
      - name: Restore qualified acceptance inputs
        id: prepared-suite
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            acceptance/qualification.test
            .factory/qualification/prepared-v1/ginkgo
            .factory/qualification/prepared-v1/receipt.json
          key: factory-prepared-v1-${{ github.run_id }}-${{ github.sha }}-${{ runner.os }}-${{ runner.arch }}-go1.27.4-race-${{ hashFiles('go.mod', 'go.sum') }}
          fail-on-cache-miss: true
      - name: Require exact prepared suite cache
        env:
          CACHE_HIT: ${{ steps.prepared-suite.outputs.cache-hit }}
        run: test "$CACHE_HIT" = true
      - name: Provision locked modules for source workflow qualification
        if: matrix.group == 'source-entrypoints'
        # docs/adr/0135-go-source-review-entrypoints.md:78.
        run: |
          GOTOOLCHAIN=local go mod download
          git diff --exit-code -- go.mod go.sum
      # docs/adr/0151-reliable-ci-qualification.md:40 -- verify before running cached programs.
      - name: Run prepared acceptance qualification
        run: make go-runtime-ci-acceptance GO_RUNTIME_TEST_TIMEOUT=25m GO_RUNTIME_TEST_GROUP=${{ matrix.group }} GO_RUNTIME_TEST_PROCS=auto GO_RUNTIME_REPORT_DIR="$RUNNER_TEMP/factory-go-reports"
      - name: Retain acceptance outcomes and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-runtime-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/factory-go-reports/
          if-no-files-found: warn
          retention-days: 7
