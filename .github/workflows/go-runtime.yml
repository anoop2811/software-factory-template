name: Go runtime candidate

# Template-only: factory-init does not copy this workflow or the factory module.
# No runtime routing, adopter Go pack selection, release artifacts or paid calls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# docs/adr/0101-go-release-handoff.md:608 — supersede PR runs only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # docs/adr/0097-installation-source-image-bundles.md:231 — suite allowance only.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Differential acceptance executes the identified historical baseline.
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum
      # per docs/adr/0072-go-budget-argument-compatibility.md:137
      - name: Install qualified Python interpreter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          activate-environment: true
          venv-path: ${{ runner.temp }}/factory-python
          no-project: true
          enable-cache: false
      - name: Confirm qualified Python interpreter
        run: |
          python3 -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 14)"
      # docs/adr/0101-go-release-handoff.md:595 — setup only; checks always run.
      - name: Restore pinned quality tools
        id: quality-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-quality-tools
          key: factory-quality-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.2-${{ hashFiles('.github/workflows/go-runtime.yml', 'tools/security/go.mod', 'tools/security/go.sum') }}
      - name: Add pinned quality tools to PATH
        run: echo "$RUNNER_TEMP/factory-quality-tools" >> "$GITHUB_PATH"
      - name: Install pinned quality tools
        if: steps.quality-tools.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/factory-quality-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go -C tools/security install -mod=readonly github.com/securego/gosec/v2/cmd/gosec
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Outside-in compatibility, race, dialect, quality and candidate build
        run: make go-runtime-source-check GO_RUNTIME_TEST_TIMEOUT=25m GO_RUNTIME_TEST_GROUP=base

  go-runtime-installation:
    name: go-runtime-${{ matrix.group }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [installation, release-handoff]
    runs-on: ${{ matrix.os }}
    # docs/adr/0101-go-release-handoff.md:559 — disjoint qualification with headroom.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Differential acceptance executes the identified historical baseline.
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum
      # per docs/adr/0072-go-budget-argument-compatibility.md:137
      - name: Install qualified Python interpreter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          activate-environment: true
          venv-path: ${{ runner.temp }}/factory-python
          no-project: true
          enable-cache: false
      - name: Confirm qualified Python interpreter
        run: |
          python3 -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 14)"
      # docs/adr/0101-go-release-handoff.md:595 — setup only; checks always run.
      - name: Restore pinned quality tools
        id: quality-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-quality-tools
          key: factory-quality-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.2-${{ hashFiles('.github/workflows/go-runtime.yml', 'tools/security/go.mod', 'tools/security/go.sum') }}
      - name: Add pinned quality tools to PATH
        run: echo "$RUNNER_TEMP/factory-quality-tools" >> "$GITHUB_PATH"
      - name: Install pinned quality tools
        if: steps.quality-tools.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/factory-quality-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go -C tools/security install -mod=readonly github.com/securego/gosec/v2/cmd/gosec
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Outside-in compatibility, race, dialect, quality and candidate build
        run: make go-runtime-source-check GO_RUNTIME_TEST_TIMEOUT=25m GO_RUNTIME_TEST_GROUP=${{ matrix.group }}
