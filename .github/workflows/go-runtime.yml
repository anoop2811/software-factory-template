name: Go runtime candidate

# Template-only: factory-init does not copy this workflow or the factory module.
# No runtime routing, adopter Go pack selection, release artifacts or paid calls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# docs/adr/0101-go-release-handoff.md:608 — supersede PR runs only.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # docs/adr/0097-installation-source-image-bundles.md:231 — suite allowance only.
    timeout-minutes: 30
    # docs/adr/0104-adaptive-qualification-workers.md:53 — bounded auto selection.
    env:
      GO_RUNTIME_TEST_MAX_PROCS: ${{ vars.GO_RUNTIME_TEST_MAX_PROCS || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Differential acceptance executes the identified historical baseline.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum
      # per docs/adr/0072-go-budget-argument-compatibility.md:137
      - name: Install qualified Python interpreter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          activate-environment: true
          venv-path: ${{ runner.temp }}/factory-python
          no-project: true
          enable-cache: false
      - name: Confirm qualified Python interpreter
        run: |
          python3 -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 14)"
      # docs/adr/0101-go-release-handoff.md:595 — setup only; checks always run.
      - name: Restore pinned quality tools
        id: quality-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-quality-tools
          key: factory-quality-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.3-${{ hashFiles('.github/workflows/go-runtime.yml', 'tools/security/go.mod', 'tools/security/go.sum') }}
      - name: Add pinned quality tools to PATH
        run: echo "$RUNNER_TEMP/factory-quality-tools" >> "$GITHUB_PATH"
      - name: Install pinned quality tools
        if: steps.quality-tools.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/factory-quality-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go -C tools/security install -mod=readonly github.com/securego/gosec/v2/cmd/gosec
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # docs/adr/0102-parallel-go-qualification.md:27 — preserve all qualification.
      - name: Outside-in compatibility, race, dialect, quality and candidate build
        run: make go-runtime-source-check GO_RUNTIME_TEST_TIMEOUT=25m GO_RUNTIME_TEST_GROUP=base GO_RUNTIME_TEST_PROCS=auto GO_RUNTIME_REPORT_DIR="$RUNNER_TEMP/factory-go-reports"
      - name: Retain acceptance outcomes and timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-runtime-base-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/factory-go-reports/
          if-no-files-found: warn
          retention-days: 7

  go-runtime-installation:
    name: go-runtime-${{ matrix.group }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # docs/adr/0113-local-cutover-qualification-partition.md:49
        group: [installation, release-handoff, source-cutover]
    runs-on: ${{ matrix.os }}
    # docs/adr/0101-go-release-handoff.md:559 — disjoint qualification with headroom.
    timeout-minutes: 30
    # docs/adr/0104-adaptive-qualification-workers.md:53 — bounded auto selection.
    env:
      GO_RUNTIME_TEST_MAX_PROCS: ${{ vars.GO_RUNTIME_TEST_MAX_PROCS || '4' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Differential acceptance executes the identified historical baseline.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: |
            go.sum
            tools/security/go.sum
      # per docs/adr/0072-go-budget-argument-compatibility.md:137
      - name: Install qualified Python interpreter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          activate-environment: true
          venv-path: ${{ runner.temp }}/factory-python
          no-project: true
          enable-cache: false
      - name: Confirm qualified Python interpreter
        run: |
          python3 -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 14)"
      # docs/adr/0101-go-release-handoff.md:595 — setup only; checks always run.
      - name: Restore pinned quality tools
        id: quality-tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-quality-tools
          key: factory-quality-v1-${{ runner.os }}-${{ runner.arch }}-go1.27.3-${{ hashFiles('.github/workflows/go-runtime.yml', 'tools/security/go.mod', 'tools/security/go.sum') }}
      - name: Add pinned quality tools to PATH
        run: echo "$RUNNER_TEMP/factory-quality-tools" >> "$GITHUB_PATH"
      - name: Install pinned quality tools
        if: steps.quality-tools.outputs.cache-hit != 'true'
        env:
          GOBIN: ${{ runner.temp }}/factory-quality-tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go -C tools/security install -mod=readonly github.com/securego/gosec/v2/cmd/gosec
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      # docs/adr/0102-parallel-go-qualification.md:32 — isolated handoff groups.
      - name: Outside-in compatibility, race, dialect, quality and candidate build
        run: make go-runtime-source-check GO_RUNTIME_TEST_TIMEOUT=25m GO_RUNTIME_TEST_GROUP=${{ matrix.group }} GO_RUNTIME_TEST_PROCS=auto GO_RUNTIME_REPORT_DIR="$RUNNER_TEMP/factory-go-reports"
      - name: Retain acceptance outcomes and timings
        if: always() && matrix.group != 'installation'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-runtime-${{ matrix.group }}-${{ runner.os }}-${{ runner.arch }}
          path: ${{ runner.temp }}/factory-go-reports/
          if-no-files-found: warn
          retention-days: 7
