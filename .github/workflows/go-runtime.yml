name: Go runtime candidate

# Template-only: factory-init does not copy this workflow or the factory module.
# No runtime routing, adopter Go pack selection, release artifacts or paid calls.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Differential acceptance executes the identified historical baseline.
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      # per docs/adr/0072-go-budget-argument-compatibility.md:137
      - name: Install qualified Python interpreter
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
          python-version: '3.12.14'
          activate-environment: true
          venv-path: ${{ runner.temp }}/factory-python
          no-project: true
          enable-cache: false
      - name: Confirm qualified Python interpreter
        run: |
          python3 -c "import sys; print(sys.version); assert sys.version_info[:3] == (3, 12, 14)"
      - name: Install pinned quality tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Outside-in compatibility, race, dialect, quality and candidate build
        run: make go-runtime-source-check
