name: Loop acceptance

# Template-only fixtures; factory-init copies ci.yml, not this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Immutable pre-conversion controller fixture provenance.
      - name: Bounded repair and checkpoint fixtures (no paid calls)
        run: ./scripts/selftest/loop.sh
