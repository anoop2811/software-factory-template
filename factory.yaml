# Software Factory configuration (Decision 2). Flat key: value only.
# Lists are space-separated on one line. Parsed by scripts/lib/config.sh.
# This is the template's own self-hosting configuration — the template runs
# its own factory. Adopters get a generated version of this file from
# factory-init.

project_name: software-factory-template
decision_log: docs/DECISION_LOG.md
docs_root: docs
citation_prefix: ""
protected_paths: "scripts/hooks scripts/lib cmd internal runtime .github/workflows AGENTS.md"
test_file_patterns: "scripts/selftest/ _test[.]go([^[:alnum:]_]|$)"
language_packs: ""
check_command: "./scripts/selftest/run.sh"
local_hooks: ""
wiki_root: wiki
wiki_staleness: false

# Opt-in factory-managed runs; plan/report never call a model (Decision 46).
budget_enabled: false
budget_max_attempts: 1
budget_max_session_runs: 5
budget_timeout_seconds: 300
budget_session_seconds: 900
budget_max_concurrent: 1
budget_estimated_usd: ""
budget_action: stop

# Loop engineering remains manual unless bounded mode is explicitly requested.
loop_enabled: false
loop_max_attempts: 2
loop_timeout_seconds: 900
loop_check_timeout_seconds: 120
loop_check_command: ""
loop_no_progress_limit: 1
