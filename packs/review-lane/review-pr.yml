name: Adversarial review

# Model findings are advisory. The separate optional completion check records
# exact coverage; a posted skip or failure never counts as a completed review.
# Trusted base code handles PR content only as data. Never execute PR-head code
# with this workflow's write token or provider key.
# Contract: docs/adr/0100-budgeted-batched-adversarial-review.md:102.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Same-repository pull request number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Manual dispatch must also execute the trusted default branch. The Go
    # adapter independently validates repository, target branch and exact refs.
    if: (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR: ${{ github.event.pull_request.number || inputs.pr }}
      REPO: ${{ github.repository }}
      EXPECTED_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      # Official v7.0.1 tag fetched 2026-09-06; released 2026-07-20.
      - name: Check out the base commit (trusted — never the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      # A trusted absolute binary is an explicit adopter opt-in. Enabling the
      # lane alone never installs Go or builds commands from an adopter's repo.
      - name: Select the explicitly configured review client
        id: client
        env:
          REVIEW_GO_CLIENT: ${{ vars.REVIEW_GO_CLIENT }}
        run: |
          if [ -z "$REVIEW_GO_CLIENT" ]; then
            echo 'mode=legacy' >> "$GITHUB_OUTPUT"
          else
            case "$REVIEW_GO_CLIENT" in /*) ;; *) echo 'REVIEW_GO_CLIENT must be an absolute trusted executable.' >&2; exit 1 ;; esac
            [ -x "$REVIEW_GO_CLIENT" ] || { echo 'Configured review client is not executable.' >&2; exit 1; }
            echo 'mode=go' >> "$GITHUB_OUTPUT"
          fi

      # Official https://github.com/actions/cache/releases/tag/v6.1.0
      # released 2026-06-26; immutable tag resolved 2026-10-17.
      - name: Restore authenticated completed batches
        if: steps.client.outputs.mode == 'go'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-review-cache
          key: factory-review-v1-${{ runner.os }}-${{ github.sha }}-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            factory-review-v1-${{ runner.os }}-${{ github.sha }}-${{ github.event.pull_request.number || inputs.pr }}-

      - name: Review
        id: review
        if: steps.client.outputs.mode == 'go'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_API_KEY: ${{ secrets.__REVIEW_API_KEY_SECRET__ }}
          REVIEW_GO_CLIENT: ${{ vars.REVIEW_GO_CLIENT }}
          REVIEW_HTTP_RETRIES: ${{ vars.REVIEW_HTTP_RETRIES != '' && vars.REVIEW_HTTP_RETRIES || '1' }}
          REVIEW_TIMEOUT_SECONDS: ${{ vars.REVIEW_TIMEOUT_SECONDS != '' && vars.REVIEW_TIMEOUT_SECONDS || '1200' }}
          REVIEW_BATCH_BYTES: ${{ vars.REVIEW_BATCH_BYTES != '' && vars.REVIEW_BATCH_BYTES || '60000' }}
          REVIEW_MAX_BATCHES: ${{ vars.REVIEW_MAX_BATCHES != '' && vars.REVIEW_MAX_BATCHES || '16' }}
          REVIEW_MAX_REQUESTS: ${{ vars.REVIEW_MAX_REQUESTS != '' && vars.REVIEW_MAX_REQUESTS || '16' }}
          REVIEW_TOTAL_MAX_TOKENS: ${{ vars.REVIEW_TOTAL_MAX_TOKENS != '' && vars.REVIEW_TOTAL_MAX_TOKENS || '524288' }}
          REVIEW_TOTAL_INPUT_BYTES: ${{ vars.REVIEW_TOTAL_INPUT_BYTES != '' && vars.REVIEW_TOTAL_INPUT_BYTES || '2097152' }}
          REVIEW_FALLBACK_PROVIDERS: ${{ vars.REVIEW_FALLBACK_PROVIDERS }}
          REVIEW_MAX_PROMPT_PRICE: ${{ vars.REVIEW_MAX_PROMPT_PRICE }}
          REVIEW_MAX_COMPLETION_PRICE: ${{ vars.REVIEW_MAX_COMPLETION_PRICE }}
        run: |
          args=(review-batch github --pr "$PR" --repository "$REPO"
            --expected-base "$EXPECTED_BASE" --output "$RUNNER_TEMP/factory-review-output"
            --cache "$RUNNER_TEMP/factory-review-cache")
          if [ -n "$EXPECTED_HEAD" ]; then args+=(--expected-head "$EXPECTED_HEAD"); fi
          FACTORY_BRIDGE_PROTOCOL='' "$REVIEW_GO_CLIENT" "${args[@]}"

      # Explicit compatibility path for adopters that have not installed the
      # Go client. Only this path retains the old single-request size boundary.
      - name: Review legacy (no batch coverage)
        if: steps.client.outputs.mode == 'legacy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_API_KEY: ${{ secrets.__REVIEW_API_KEY_SECRET__ }}
          REVIEW_GO_CLIENT: ''
          REVIEW_TIMEOUT_SECONDS: ${{ vars.REVIEW_TIMEOUT_SECONDS != '' && vars.REVIEW_TIMEOUT_SECONDS || '1200' }}
          REVIEW_HTTP_RETRIES: ${{ vars.REVIEW_HTTP_RETRIES != '' && vars.REVIEW_HTTP_RETRIES || '1' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAX_DIFF_BYTES: 200000
        run: |
          case "$PR" in ''|*[!0-9]*) echo 'Invalid pull request number.' >&2; exit 1 ;; esac
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/factory-review-initial.json"
          jq -e --arg repo "$REPO" --arg branch "$DEFAULT_BRANCH" --arg base "$EXPECTED_BASE" --arg head "$EXPECTED_HEAD" \
            '.head.repo.full_name == $repo and .base.repo.full_name == $repo and .base.ref == $branch and .base.sha == $base and ($head == "" or .head.sha == $head)' \
            "$RUNNER_TEMP/factory-review-initial.json" > /dev/null
          head=$(jq -r '.head.sha' "$RUNNER_TEMP/factory-review-initial.json")
          gh api "repos/$REPO/pulls/$PR" -H 'Accept: application/vnd.github.v3.diff' > "$RUNNER_TEMP/factory-review.diff"
          mkdir "$RUNNER_TEMP/factory-review-output"
          review="$RUNNER_TEMP/factory-review-output/review.md"
          size=$(wc -c < "$RUNNER_TEMP/factory-review.diff" | tr -d ' ')
          status=failed
          if [ "$size" -gt "$MAX_DIFF_BYTES" ]; then
            status=skipped
            printf 'Legacy review skipped: %s bytes exceeds the %s-byte limit. Configure REVIEW_GO_CLIENT for budgeted batches.\n' "$size" "$MAX_DIFF_BYTES" > "$review"
          elif [ -z "$REVIEW_API_KEY" ]; then
            printf 'Model review did not run: repository secret __REVIEW_API_KEY_SECRET__ is missing.\n' > "$review"
          elif ./scripts/adversarial-review.sh "$RUNNER_TEMP/factory-review.diff" > "$review" 2> "$RUNNER_TEMP/factory-review-legacy.err" && [ -s "$review" ]; then
            status=complete
          else
            printf 'Legacy model review failed; this pull request has not received a completed model review.\n' > "$review"
            # Publish only fixed classifications; provider stderr can contain secrets.
            while IFS= read -r reason; do
              case "$reason" in
                'adversarial-review: request timed out.'|'adversarial-review: transport failure.'|'adversarial-review: HTTP request failed.'|'adversarial-review: incomplete review: OpenRouter reached the response token limit (finish_reason=length).')
                  printf '\n%s\n' "$reason" >> "$review" ;;
                'adversarial-review: the model returned no review'*)
                  printf '\nThe provider returned no completed review.\n' >> "$review" ;;
              esac
            done < "$RUNNER_TEMP/factory-review-legacy.err"
          fi
          # Bind the posted finding to the same revisions used for its input.
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/factory-review-current.json"
          jq -e --arg repo "$REPO" --arg branch "$DEFAULT_BRANCH" --arg base "$EXPECTED_BASE" --arg head "$head" \
            '.head.repo.full_name == $repo and .base.repo.full_name == $repo and .base.ref == $branch and .base.sha == $base and .head.sha == $head' \
            "$RUNNER_TEMP/factory-review-current.json" > /dev/null
          jq -n --arg status "$status" --arg repository "$REPO" --arg base "$EXPECTED_BASE" --arg head "$head" \
            '{version:1,mode:"legacy-single-request",status:$status,repository:$repository,base:$base,head:$head,batch_coverage_available:false}' \
            > "$RUNNER_TEMP/factory-review-output/report.json"
          {
            printf '## Legacy adversarial review (advisory): %s\n\n' "$status"
            printf 'Commit: `%s`. Legacy single request; no batch coverage manifest.\n\n' "$head"
            cat "$review"
          } > "$RUNNER_TEMP/factory-review-comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/factory-review-comment.md"
          # Posting an incomplete notice must not turn the review workflow green.
          [ "$status" = complete ]

      - name: Save authenticated completed batches
        if: always() && steps.client.outputs.mode == 'go' && steps.review.outcome != 'skipped'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/factory-review-cache
          key: factory-review-v1-${{ runner.os }}-${{ github.sha }}-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Official https://github.com/actions/upload-artifact/releases/tag/v7.0.2
      # released 2026-10-07; immutable tag resolved 2026-10-17.
      - name: Retain exact-commit coverage and findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: adversarial-review-${{ github.event.pull_request.number || inputs.pr }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/factory-review-output/report.json
            ${{ runner.temp }}/factory-review-output/review.md
          if-no-files-found: warn
          retention-days: 7
