  </defs>

  <path fill="#f7f5ed" d="M0 0h1200v627H0z"/>
  <path fill="#133f36" d="M760 0h440v627H760z"/>
  <path fill="url(#dots)" d="M760 0h440v627H760z"/>

  <g transform="translate(62 55)">
