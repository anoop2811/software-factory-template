<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="627" viewBox="0 0 1200 627">
  <title>Software AI Factory. Your repo, ready for coding agents.</title>
  <desc>Codex, Claude Code and OpenCode. Four illustrated layers stack into a terminal.</desc>
